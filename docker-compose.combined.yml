# docker-compose.combined.yml
# Usage: docker compose -f docker-compose.combined.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ecovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecovision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecovision"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.combined
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://ecovision:${POSTGRES_PASSWORD}@postgres:5432/ecovision
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEVTEAM_BOOTSTRAP_USERNAME: ${DEVTEAM_BOOTSTRAP_USERNAME}
      DEVTEAM_BOOTSTRAP_PASSWORD: ${DEVTEAM_BOOTSTRAP_PASSWORD}
      ECOVISION_WRITABLE_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/data
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8001:8001"

volumes:
  pgdata:
  app_data: