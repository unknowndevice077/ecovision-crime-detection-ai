name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          # httpx: FastAPI's TestClient needs it; without it every API test
          # module fails at import ("starlette.testclient requires httpx").
          pip install pytest httpx
          # The detector tests (test_person_confirm, test_violence_calibration)
          # import torch; the CPU build of the same version the app pins.
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run backend tests
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret
        run: pytest tests/ -v