<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EcoVision Sentinel</title>
<link rel="stylesheet" href="console.css" />
<style>
  /* This window's only job is to exist immediately. app.whenReady() plus a
     couple of fs.existsSync() calls is usually instant, but on a cold disk
     cache, an antivirus scan of a freshly-unpacked app.asar.unpacked, or a
     slow network share install location, that "usually instant" check can
     stretch to several seconds -- during which, without this window, nothing
     is on screen at all and the app looks hung or crashed. */
  body {
    align-items: center; justify-content: center; padding: 0; gap: 14px;
  }
  .mark { width: 52px; height: auto; opacity: 0.95; }
  .txt { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
  <img class="mark" src="logo.png" alt="" />
  <div class="txt"><span class="dot"></span>Starting EcoVision Sentinel…</div>
</body>
</html>
